<body class="homeSplashBody">
  <div id="homeSplash" class="homeSplash" aria-hidden="true">
    <div class="homeSplashPulseLine"></div>

    <div id="homeSplashPanel" class="homeSplashPanel">
      <div class="homeSplashInner">

        <div class="homeSplashLoader" aria-hidden="true">

        </div>

        <div class="homeSplashText">
          <span id="homeSplashProgressText">0%</span>

        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
<header class="top topHeader">
  <div class="headerLogoWrap">
    <img src="/home/blackburn-ravers-header.png?v=20260326" alt="The Blackburn Ravers" class="headerLogo" />
  </div>
</header>

    <main>
      <div class="grid">
        <a class="card" href="/player">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-play"></i></div>
          <div class="label">Player</div>
          <div class="hint">Stream & queue</div>
        </a>

        <a class="card" href="/converter">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-right-left"></i></div>
          <div class="label">Converter</div>
          <div class="hint">Formats & presets</div>
        </a>

        <a class="card" href="/tagger">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-tag"></i></div>
          <div class="label">Tagger</div>
          <div class="hint">ID3 & artwork</div>
        </a>

        <a class="card" href="/mastering">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-sliders"></i></div>
          <div class="label">Mastering</div>
          <div class="hint">Preview renders</div>
        </a>

        <a class="card" href="/video-player">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-film"></i></div>
          <div class="label">Video Player</div>
          <div class="hint">Video playback</div>
        </a>

        <a class="card" href="/server-settings">
          <div class="icon" aria-hidden="true"><i class="fa-solid fa-gear"></i></div>
          <div class="label">Server Settings</div>

        <a class="card" href="/stats">

      <footer class="foot">
        <div class="muted">Tip: Add this page to your home screen for an app-like launcher.</div>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      const body = document.body;
      const splash = document.getElementById("homeSplash");
      const progressText = document.getElementById("homeSplashProgressText");
      const progressFill = document.getElementById("homeSplashProgressFill");

      if (!body || !splash) return;

      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function finishSplash() {
        body.classList.add("homeSplashDone");
        splash.classList.add("hidden");
        splash.setAttribute("aria-hidden", "true");
      }

      if (reduceMotion) {
        finishSplash();
        return;
      }

      splash.setAttribute("aria-hidden", "false");

      const startedAt = performance.now();
      const progressDuration = 1650;

      function animateProgress(now) {
        const ratio = Math.min(1, (now - startedAt) / progressDuration);
        const eased = 1 - Math.pow(1 - ratio, 3);
        const percent = Math.min(100, Math.round(eased * 100));

        if (progressText) progressText.textContent = `${percent}%`;
        if (progressFill) progressFill.style.width = `${percent}%`;

        if (ratio < 1) {
          requestAnimationFrame(animateProgress);
          return;
        }

        body.classList.add("homeSplashHold");

        window.setTimeout(() => {
          body.classList.add("homeSplashDock");
        }, 260);

        window.setTimeout(() => {
          finishSplash();
        }, 1220);
      }

      requestAnimationFrame(() => {
        body.classList.add("homeSplashRun");
        requestAnimationFrame(animateProgress);
      });
    })();
  </script>

  <script>
    (function () {
      const BR_ICON_BASE_PATH = "/player/branding/icons/";

      const BR_ICON_CLASS_MAP = {
        play: "play",
        "right-left": "right-left",
        tag: "tag",
        sliders: "sliders",
        gear: "gear-complex",
        "chart-column": "chart-column",
        headphones: "headphones",
        server: "server",
        "arrows-rotate": "arrow-rotate-right",
        tags: "tags",
        film: "video",
        tv: "tv-music",
      };

      const brIconSvgCache = new Map();

      function getBrIconNameFromElement(el) {
        if (!el || !el.classList) return "";

        const ignoredFaClasses = [
          "fa-solid",
          "fa-regular",
          "fa-brands",
          "fa-duotone",
          "fa-light",
          "fa-thin",
          "fa-sharp",
          "fa-spin",
          "fa-pulse",
          "fa-fw",
          "fa-lg",
          "fa-xl",
          "fa-2x",
        ];

        const iconClass = Array.from(el.classList).find((className) =>
          className.startsWith("fa-") && !ignoredFaClasses.includes(className)
        );

        return iconClass ? iconClass.replace(/^fa-/, "") : "";
      }

      async function loadBrIconSvg(svgName) {
        if (brIconSvgCache.has(svgName)) return brIconSvgCache.get(svgName);

        const promise = fetch(`${BR_ICON_BASE_PATH}${svgName}.svg`, { cache: "force-cache" })
          .then((res) => {
            if (!res.ok) throw new Error(`Icon not found: ${svgName}`);
            return res.text();
          })
          .then((text) => {
            const template = document.createElement("template");
            template.innerHTML = text.trim();
            const svg = template.content.querySelector("svg");
            if (!svg) throw new Error(`Invalid icon SVG: ${svgName}`);
            svg.setAttribute("aria-hidden", "true");
            svg.setAttribute("focusable", "false");
            svg.classList.add("brSvgIconSvg");
            return svg.outerHTML;
          });

        brIconSvgCache.set(svgName, promise);
        return promise;
      }

      async function hydrateBrIcon(el) {
        if (!el || el.nodeType !== 1 || !el.matches?.("i[class*='fa-']")) return;

        const iconName = getBrIconNameFromElement(el);
        const svgName = BR_ICON_CLASS_MAP[iconName] || "";
        if (!svgName) return;

        el.classList.add("brSvgIconHost");

        if (el.dataset.brIconName === iconName && el.dataset.brIconSvg === svgName && el.dataset.brIconHydrated === "1") {
          return;
        }

        el.dataset.brIconName = iconName;
        el.dataset.brIconSvg = svgName;

        try {
          el.innerHTML = await loadBrIconSvg(svgName);
          el.dataset.brIconHydrated = "1";
        } catch {
          el.dataset.brIconHydrated = "0";
        }
      }

      function hydrateBrIcons(root = document) {
        const nodes = root?.matches?.("i[class*='fa-']")
          ? [root]
          : Array.from(root?.querySelectorAll?.("i[class*='fa-']") || []);

        nodes.forEach((node) => {
          void hydrateBrIcon(node);
        });
      }

      hydrateBrIcons(document);
    })();
  </script>
</body>
</html>
